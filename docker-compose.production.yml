version: '3.8'

services:
  selllio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selllio-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      # Persist uploaded files
      - ./public/uploads:/app/public/uploads
    networks:
      - selllio-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  selllio-network:
    driver: bridge

volumes:
  uploads:
    driver: local
